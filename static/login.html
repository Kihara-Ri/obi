<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f4f5f7">
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0e1014">
  <script src="/theme.js"></script>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="stylesheet" href="/assets/index.css">
  <link rel="stylesheet" href="/login.css">
  <link rel="icon" href="/favicon.svg">
  <title>登录 · Obi</title>
</head>
<body>
  <main class="login-page">
    <section class="login-card" aria-labelledby="login-title">
      <div class="vinyl" aria-hidden="true"><i class="vinyl-hole"></i></div>
      <h1 id="login-title">Obi</h1>
      <form id="login-form" method="post" action="/api/login">
        <label class="login-label" for="code">Google Authenticator · 6 位动态码</label>
        <div class="login-code-field">
          <input id="code" name="code" type="text" inputmode="numeric" autocomplete="one-time-code"
                 pattern="[0-9]{6}" maxlength="6" required autofocus aria-describedby="login-error">
        </div>
        <p id="login-error" role="alert"></p>
        <button class="primary" type="submit" aria-label="登录">
          <span class="btn-text">登录</span><i class="spinner" aria-hidden="true" hidden></i>
        </button>
      </form>
    </section>
  </main>
  <script type="module" src="/login.js"></script>
</body>
</html>

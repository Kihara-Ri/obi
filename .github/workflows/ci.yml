name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  data-guard:
    name: 数据泄漏扫描
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: 当前文件树扫描（文件名 + 内容）
        run: tools/check-data-leak.sh
        env:
          LEAK_PATTERNS: ${{ secrets.LEAK_PATTERNS }}
      - name: 全历史文件名扫描（个人数据不得进任何提交）
        run: |
          if git log --all --pretty=format: --name-only | sort -u \
             | grep -E '((^|/)listing-(chatgpt|providers)[.](json|tmp|lock)$|(^|/)listing-anthropic/|^data/|\.sqlite3$|\.sqlite3-|(^|/)update\.env$|(^|/)vision-config\.json$|/albums\.json$|部署登录信息|出售记录|封面核对报告|管理系统方案)'; then
            echo '✗ git 历史中混入个人数据文件'
            exit 1
          fi
          echo '✓ 全历史无个人数据文件'

  backend:
    name: 后端测试（纯标准库）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # 各测试模块并行跑在独立进程里（与 unittest discover 同一批测试）
      - run: python3 tools/run_tests.py

  web:
    name: 前端契约测试 + typecheck + 构建
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm --prefix web ci
      - run: npm --prefix web test
      - run: npm --prefix web run typecheck
      - run: npm --prefix web run build

  docker:
    name: Docker 镜像构建
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose build

  android:
    name: 安卓外壳编译
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - run: npm --prefix web ci
      - run: npm --prefix web run build:local
      - name: 编译 debug 包（正式签名只在发布时做，见 android.yml）
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon -q

  # 软件 GL 下 3D 挂载很慢：把浏览器验收拆成三个并行 runner，墙钟取最长的一片。
  sample-browser:
    name: 浏览器验收 · ${{ matrix.suite.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        suite:
          - {id: card, name: 真实封面 · 卡片 · 移动端, parts: 'card,mobile'}
          - {id: models, name: 3D 参考实体贴图, parts: models}
          - {id: listing, name: 售卖草稿与图片下载（模拟模型）}
    steps:
      # job 级 env 不能引用 runner 上下文（会让整个工作流文件无效），改在首个步骤里写入环境
      - name: 准备预览目录变量
        run: |
          echo "OBI_DEV_HOME=$RUNNER_TEMP/obi-preview" >> "$GITHUB_ENV"
          echo "OBI_PREVIEW_SCREENSHOTS=$RUNNER_TEMP/obi-preview-screenshots" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm --prefix web ci
      - run: npm --prefix web run build
      - name: 缓存 Playwright Chromium
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('web/package-lock.json') }}
      - name: 安装 Chromium 与系统依赖
        working-directory: web
        run: |
          if [ '${{ steps.playwright-cache.outputs.cache-hit }}' = true ]; then
            npx --no-install playwright install-deps chromium
          else
            npx --no-install playwright install --with-deps chromium
          fi
      - name: 缓存锁定的公开素材包
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/obi-preview/bundle
          key: sample-bundle-${{ runner.os }}-${{ hashFiles('tools/sample-bundle.json') }}
          # 锁文件变了也先拿旧包：未变的素材按哈希复用，只下载新增 / 变更的
          restore-keys: sample-bundle-${{ runner.os }}-
      - name: 准备并校验固定样本
        run: |
          python3 tools/preview_samples.py prepare --download
          python3 tools/preview_samples.py check > "$RUNNER_TEMP/obi-preview-check.json"
      - name: 启动隔离预览并验证真实封面与贴图
        if: matrix.suite.parts
        run: |
          python3 tools/preview_samples.py start --port 63282 > "$RUNNER_TEMP/obi-preview-server.log" 2>&1 &
          preview_pid=$!
          trap 'kill "$preview_pid" 2>/dev/null || true; wait "$preview_pid" 2>/dev/null || true' EXIT
          ready=false
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:63282/api/health > /dev/null; then
              ready=true
              break
            fi
            if ! kill -0 "$preview_pid" 2>/dev/null; then
              cat "$RUNNER_TEMP/obi-preview-server.log"
              exit 1
            fi
            sleep 1
          done
          if [ "$ready" != true ]; then
            cat "$RUNNER_TEMP/obi-preview-server.log"
            exit 1
          fi
          npm --prefix web run test:browser -- --url http://127.0.0.1:63282 --expectations "$RUNNER_TEMP/obi-preview-check.json" --parts '${{ matrix.suite.parts }}'
      - name: 售卖草稿与图片下载验收（模拟模型）
        if: matrix.suite.id == 'listing'
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          from tools.seed_samples import seed_listing_reference_photos
          seed_listing_reference_photos(Path(os.environ['OBI_DEV_HOME']) / 'instance')
          PY
          python3 tests/serve_listing_acceptance.py --data-dir "$OBI_DEV_HOME/instance" > "$RUNNER_TEMP/obi-listing-server.log" 2>&1 &
          listing_pid=$!
          trap 'kill "$listing_pid" 2>/dev/null || true; wait "$listing_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 60); do
            listing_url=$(sed -n 's/^ACCEPTANCE_URL=//p' "$RUNNER_TEMP/obi-listing-server.log" | head -1)
            [ -n "$listing_url" ] && break
            kill -0 "$listing_pid" || exit 1
            sleep 1
          done
          LISTING_ACCEPTANCE_URL="$listing_url" node web/tests/browser/listing-acceptance.mjs
          # 主验收会改写长文样本；结束后再经 storage 事务写入固定长文，专测展开/收起。
          python3 - <<'PY'
          import os
          from pathlib import Path
          from tools.seed_samples import seed_listing_long_copy
          seed_listing_long_copy(Path(os.environ['OBI_DEV_HOME']) / 'instance')
          PY
          LISTING_ACCEPTANCE_URL="$listing_url" node web/tests/browser/listing-reader-acceptance.mjs
      - name: 保存失败现场与样本诊断
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: sample-browser-failure-${{ matrix.suite.id }}
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/obi-preview-screenshots/
            ${{ runner.temp }}/obi-preview-check.json
            ${{ runner.temp }}/obi-preview-server.log
            ${{ runner.temp }}/obi-listing-server.log
